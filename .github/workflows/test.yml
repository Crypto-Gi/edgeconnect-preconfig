# Runs the offline unit tests on every pull request and push to main or gui, on the oldest and newest supported Python, on Linux and macOS.
name: test
on:
  pull_request:
  push:
    branches: [main, gui]
permissions:
  contents: read
jobs:
  test:
    # ubuntu-latest (26.04) has no Python 3.9 build for setup-python; 24.04 still does.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
        env:
          EC_DOTENV: /nonexistent/.env  # no Orchestrator: the tests are offline
  browser:
    # The GUI in Chromium (docs/gui/BUILD_PLAN.md step 11): the smoke test from an appliance to written YAML files, and axe-core on
    # every screen in both themes, failing on any serious or critical violation. Playwright and axe-core are test-only, installed here.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pip install playwright==1.64.1 && python -m playwright install --with-deps chromium
      - run: npm install --prefix "$RUNNER_TEMP/axe" axe-core@4.10.3
      - run: python -m unittest discover -s tests -p test_browser.py -v
        env:
          EC_DOTENV: /nonexistent/.env  # no Orchestrator: the fake in tests/e2e/gui_launcher.py answers
          EDGECONNECT_BROWSER_TESTS: "1"
          AXE_CORE_JS: ${{ runner.temp }}/axe/node_modules/axe-core/axe.min.js
