# Source fields the API has returned, per read (translate.new_source_fields, docs/decisions/0020). A field a capture holds that is not here
# is "new": no converter rule was written with it in view, so translate ledgers it (new-source-field) to check by hand.
# Made from the same 98 captures as observed-fields.yaml (6 Orchestrators, ECOS 9.3 to 9.7.2; 2026-10-31), every ok read (live, cached,
# orchestrator, backup). Field names only, never values. A key that is not a field name (lower camel or snake case, digits allowed; an IP,
# an id, a name, or an interface or map name such as lan0) is "*", and so is every key of a record map (2+ non-empty objects with the
# same keys); record_maps lists, per read, the paths that were record maps on some appliance, so they are "*" on every appliance. Widen only by hand: regenerate from captures whose builds validated, and
# say in the commit which ones.
