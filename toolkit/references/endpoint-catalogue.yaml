  # --- sources found for sections that have no Orchestrator endpoint (2026-10-15, evidence in references/lessons.md) ---
  - {id: ip-allow-list, path: /appliance/rest, scope: appliance, source: live, params: {url: ipAllowList}, sections: [ipAllowList],
     notes: "GET passthrough to the appliance REST API; live only"}
  - {id: static-routes-configured, path: /appliance/rest, scope: appliance, source: live, params: {url: subnets3/configured}, sections: [localRoutes, segmentLocalRoutes],
     notes: "GET passthrough; configured static routes keyed prefix > nhop > interface, with comment and the advert_bgp/advert_ospf flags that /subnets reports as false (2026-10-17 round trip)"}
  - {id: running-config, path: /appliance/backup, scope: appliance, source: backup, params: {runningConfig: "true"}, reduce: latest-backup,
