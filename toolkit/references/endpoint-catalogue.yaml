  - {id: peer-priority, path: /appliance/peerPriorityList, scope: appliance, source: cached, sections: [peerPriority]}
  - {id: vrrp, path: /vrrp, scope: appliance, source: cached, sections: [vrrp]}
  - {id: ipsla-managers, path: /ipsla/config/managers, scope: appliance, source: fromGms, sections: [ipSlaRule]}
  - {id: port-forwarding, path: /portForwarding, scope: appliance, source: cached, sections: [inboundPortForwarding]}
