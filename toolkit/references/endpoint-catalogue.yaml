# Read endpoints that inform preconfig sections. Data, not code: capture.py reads this file.
# Evidence: Orchestrator 9.7.1.42046 Swagger (API-ORCH/swagger_file_api_9.7.1.42046), paths under /gms/rest.
#
# Fields
#   id        file-name stem for the capture
#   path      GET path (relative to /gms/rest)
#   scope     appliance    -> nePk query parameter added
#             orchestrator -> no nePk; Orchestrator-wide context, captured once per run
#   source    cached   -> cached=true is saved as "cached", cached=false as "live"
#             fromGms  -> fromGms=true is "cached", fromGms=false is "live"
#             single   -> one request, saved as "orchestrator" (data only Orchestrator holds)
#             live     -> one request, saved as "live" (GET passthrough to the appliance)
#             backup   -> one request, saved as "backup" (stored running-config backups)
#   params    extra fixed query parameters
#   reduce    latest-backup -> keep only the newest entry of a list answer
#   sections  preconfig top-level sections the data informs ([] = context only)
#   seen_on   Orchestrator releases where the endpoint answered (filled from capture results)
#   notes     limits and interpretation hints
#
# Grows with evidence. Never add state-only endpoints (leases, neighbours, tunnel state, statistics).

endpoints:
  # --- identity and Orchestrator-held data ---------------------------------------------------
  - {id: appliance, path: /appliance, scope: appliance, source: single, sections: [applianceInfo],
     notes: "hostname, group, site, model, softwareVersion; nePk itself is a runtime ID"}
  - {id: appliances-all, path: /appliance, scope: orchestrator, source: single, sections: [deploymentInfo],
     notes: "peer hostname and serial for EdgeHA haConfig"}
  - {id: network-role-and-site, path: /appliance/networkRoleAndSite, scope: appliance, source: single, sections: [applianceInfo]}
  - {id: extra-info, path: /appliance/extraInfo, scope: appliance, source: single, sections: [applianceInfo],
     notes: "location and contact"}
  - {id: region-associations, path: /regions/appliances, scope: orchestrator, source: single, sections: [applianceInfo]}
  - {id: regions, path: /regions, scope: orchestrator, source: single, sections: []}
  - {id: groups, path: /gms/group, scope: orchestrator, source: single, sections: [applianceInfo],
     notes: "resolve group ID to group name"}
  - {id: template-association, path: /template/applianceAssociation, scope: appliance, source: single, sections: [templateGroups]}
  - {id: template-groups, path: /template/templateGroups, scope: orchestrator, source: single, sections: [],
     notes: "which templates each group contains; drives template-group ownership"}
  - {id: security-maps, path: /securityMaps, scope: appliance, source: single, sections: [],
     notes: "firewall zone-pair rules; preconfig has no firewall section, read only to ledger rules Orchestrator did not push (gms_marked false)"}
  - {id: overlay-config, path: /gms/overlays/config, scope: orchestrator, source: single, sections: [businessIntentOverlays]}
  - {id: overlay-association, path: /gms/overlays/association, scope: orchestrator, source: single, sections: [businessIntentOverlays]}
  - {id: interface-labels, path: /gms/interfaceLabels, scope: orchestrator, source: single, sections: [],
     notes: "resolve interface-label IDs to names"}
  - {id: segments, path: /vrf/config/segments, scope: orchestrator, source: single, sections: [],
     notes: "resolve segment (VRF) IDs to names"}
  - {id: zones, path: /zones, scope: orchestrator, source: single, sections: [],
     notes: "resolve zone IDs to names"}
  - {id: ha-groups, path: /haGroups, scope: orchestrator, source: single, sections: [deploymentInfo]}
  - {id: cluster-profiles, path: /cluster/profiles, scope: orchestrator, source: single, sections: [applianceInfo],
     notes: "clusterProfile"}
  - {id: cluster-profile-mapping, path: /cluster/profileMapping, scope: orchestrator, source: single, sections: [applianceInfo]}
  - {id: appexpress-group-association, path: /applicationDefinition/appExpressGroup/association, scope: orchestrator, source: single, sections: [appExpressGroups]}
  - {id: zscaler-association, path: /thirdPartyServices/zscaler/applianceAssociation, scope: orchestrator, source: single, sections: [thirdPartyServicesAssociation]}
  - {id: axis-association, path: /thirdPartyServices/axis/applianceAssociation, scope: orchestrator, source: single, sections: [thirdPartyServicesAssociation]}
  - {id: netskope-association, path: /thirdPartyServices/netskope/applianceAssociation, scope: orchestrator, source: single, sections: [thirdPartyServicesAssociation]}
  - {id: ids-profile-state, path: /ids/profilestate, scope: orchestrator, source: single, sections: [idsIpsConfig]}
  - {id: ids-state, path: /ids/state, scope: orchestrator, source: single, sections: [idsIpsConfig]}

